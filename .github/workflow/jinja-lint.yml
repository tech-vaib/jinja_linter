name: Jinja Template Validation

on:
  pull_request:

jobs:
  jinja-lint:
    name: Validate Jinja Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Run Jinja syntax validation
        run: |
          python scripts/jinja_linter.py
